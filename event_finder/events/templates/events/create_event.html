{% extends 'events/base.html' %}
{% block title %}Создать мероприятие - Event Finder{% endblock %}
{% block content %}
    <h1>Создать новое мероприятие</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Создать</button>
    </form>
    <a href="{% url 'events:home' %}" class="btn btn-secondary mt-3">Назад</a>
{% endblock %}
