{% extends 'events/base.html' %}
{% block title %}Регистрация - Event Finder{% endblock %}
{% block content %}
    <h1>Регистрация</h1>
    <div class="auth-form">
        <form id="register-form" method="post" action="{% url 'events:register' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Электронная почта</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="city" class="form-label">Город</label>
                <input type="text" class="form-control" id="city" name="city">
            </div>
            <div class="mb-3">
                <label for="profile_picture" class="form-label">Фото профиля</label>
                <input type="file" class="form-control" id="profile_picture" name="profile_picture">
            </div>
            <div class="mb-3">
                <label for="password1" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password1" name="password1" required>
            </div>
            <div class="mb-3">
                <label for="password2" class="form-label">Подтверждение пароля</label>
                <input type="password" class="form-control" id="password2" name="password2" required>
            </div>
            <div class="mb-3">
                <label for="is_organizer" class="form-check-label">
                    <input type="checkbox" class="form-check-input" id="is_organizer" name="is_organizer">
                    Я организатор
                </label>
            </div>
            <input type="hidden" name="start_time" id="start-time">
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>
        <p class="mt-3">Уже есть аккаунт? <a href="{% url 'events:login' %}">Войдите</a></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Фиксируем время начала процесса
            const startTime = new Date().getTime();
            document.getElementById('start-time').value = startTime;

            const form = document.getElementById('register-form');
            form.addEventListener('submit', async function(event) {
                event.preventDefault();

                const formData = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.success) {
                            // Успешная регистрация, показываем уведомление с временем
                            const notificationDiv = document.createElement('div');
                            notificationDiv.className = 'notification success';
                            notificationDiv.innerHTML = `Вы успешно зарегистрировались! Время: ${data.time_spent} секунд. Перенаправление...`;
                            document.body.appendChild(notificationDiv);

                            // Перенаправление через 2 секунды
                            setTimeout(() => {
                                window.location.href = data.redirect_url;
                            }, 2000);
                        } else {
                            // Ошибка регистрации, показываем уведомление
                            const notificationDiv = document.createElement('div');
                            notificationDiv.className = 'notification error';
                            let errorMessage = data.error || 'Ошибка регистрации. Проверьте данные.';
                            if (data.errors) {
                                const errors = JSON.parse(data.errors);
                                errorMessage += '<ul>';
                                for (let field in errors) {
                                    errors[field].forEach(error => {
                                        errorMessage += `<li>${field}: ${error.message}</li>`;
                                    });
                                }
                                errorMessage += '</ul>';
                            }
                            notificationDiv.innerHTML = errorMessage;
                            document.body.appendChild(notificationDiv);
                        }
                    } else {
                        console.error('Ошибка сервера:', response.status);
                    }
                } catch (error) {
                    console.error('Ошибка:', error);
                }
            });
        });
    </script>
{% endblock %}
