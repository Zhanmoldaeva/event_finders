{% extends 'events/base.html' %}
{% block title %}Вход - Event Finder{% endblock %}
{% block content %}
    <h1>Вход</h1>
    <div class="auth-form">
        <form id="login-form" method="post" action="{% url 'events:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <input type="hidden" name="start_time" id="start-time">
            <button type="submit" class="btn btn-primary" id="submit-btn">Войти</button>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'events:register' %}">Зарегистрируйтесь</a></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const startTime = new Date().getTime();
            document.getElementById('start-time').value = startTime;

            const form = document.getElementById('login-form');
            const submitBtn = document.getElementById('submit-btn');

            const getCsrfToken = () => {
                return document.querySelector('input[name="csrfmiddlewaretoken"]').value;
            };

            const checkAuthStatus = async () => {
                try {
                    const response = await fetch('{% url "events:check_auth" %}', {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    });
                    const data = await response.json();
                    console.log('Статус авторизации:', data);
                    return data.is_authenticated;
                } catch (error) {
                    console.error('Ошибка проверки авторизации:', error);
                    return false;
                }
            };

            form.addEventListener('submit', async function(event) {
                event.preventDefault();
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';
                submitBtn.disabled = true;

                const formData = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'X-CSRFToken': getCsrfToken()
                        }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        console.log('Ответ сервера:', data);

                        const isAuthenticated = await checkAuthStatus();

                        if (data.success || isAuthenticated) {
                            const notificationDiv = document.createElement('div');
                            notificationDiv.className = 'notification success';
                            notificationDiv.innerHTML = `<i class="fas fa-check-circle me-2"></i> Вы успешно вошли! Время: ${data.time_spent || 'неизвестно'} секунд. Перенаправление...`;
                            document.body.appendChild(notificationDiv);

                            setTimeout(() => {
                                console.log('Перенаправление на:', data.redirect_url || '/');
                                window.location.href = data.redirect_url || '/';
                            }, 2000);
                        } else {
                            const notificationDiv = document.createElement('div');
                            notificationDiv.className = 'notification error';
                            notificationDiv.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i> ${data.error || 'Ошибка входа. Проверьте данные.'}`;
                            document.body.appendChild(notificationDiv);
                            submitBtn.innerHTML = 'Войти';
                            submitBtn.disabled = false;
                        }
                    } else {
                        console.error('Ошибка сервера:', response.status);
                        const isAuthenticated = await checkAuthStatus();
                        if (isAuthenticated) {
                            const notificationDiv = document.createElement('div');
                            notificationDiv.className = 'notification success';
                            notificationDiv.innerHTML = `<i class="fas fa-check-circle me-2"></i> Вы уже авторизованы! Перенаправление...`;
                            document.body.appendChild(notificationDiv);
                            setTimeout(() => {
                                window.location.href = '/';
                            }, 2000);
                        } else {
                            const notificationDiv = document.createElement('div');
                            notificationDiv.className = 'notification error';
                            notificationDiv.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i> Ошибка сервера. Попробуйте снова.`;
                            document.body.appendChild(notificationDiv);
                            submitBtn.innerHTML = 'Войти';
                            submitBtn.disabled = false;
                        }
                    }
                } catch (error) {
                    console.error('Ошибка при выполнении запроса:', error);
                    const isAuthenticated = await checkAuthStatus();
                    if (isAuthenticated) {
                        const notificationDiv = document.createElement('div');
                        notificationDiv.className = 'notification success';
                        notificationDiv.innerHTML = `<i class="fas fa-check-circle me-2"></i> Вы уже авторизованы! Перенаправление...`;
                        document.body.appendChild(notificationDiv);
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    } else {
                        const notificationDiv = document.createElement('div');
                        notificationDiv.className = 'notification error';
                        notificationDiv.innerHTML = `<i class="fas fa-exclamation-circle me-2"></i> Произошла ошибка. Попробуйте снова.`;
                        document.body.appendChild(notificationDiv);
                        submitBtn.innerHTML = 'Войти';
                        submitBtn.disabled = false;
                    }
                }
            });
        });
    </script>
{% endblock %}
